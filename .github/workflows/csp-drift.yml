name: CSP Drift

run-name: >-
  CSP Drift • ${{ github.event_name }} • ${{ github.ref_name }}

# ============================================================================
# PURPOSE
# ============================================================================
# The production Content-Security-Policy (in netlify.toml) allow-lists every
# inline <script> and <style> block in the build output via SHA-256 hash.
# Those hashes are generated by `scripts/generate-csp-hashes.mjs`, invoked
# from `astro.config.mjs` as an `astro:build:done` hook (see ADR-0030).
#
# This workflow guards the invariant that the committed netlify.toml matches
# what `pnpm run build` produces. A drift means either:
#   - Someone changed an inline block's content and didn't re-run the build.
#   - Someone edited netlify.toml by hand.
#   - A merge conflict in netlify.toml was resolved incorrectly.
#
# All three are caught here before they reach production and lock out every
# inline script in the site with a CSP violation.
# ============================================================================

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/generate-csp-hashes.mjs"
      - "astro.config.mjs"
      - "netlify.toml"
      - "package.json"
      - "pnpm-lock.yaml"

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  csp-drift:
    name: CSP Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build (regenerates CSP hashes in netlify.toml)
        run: pnpm run build

      - name: Verify netlify.toml matches build output
        run: |
          if ! git diff --exit-code netlify.toml; then
            echo "::error file=netlify.toml::CSP hashes in committed netlify.toml don't match the current build output."
            echo ""
            echo "To fix: run 'pnpm run build' locally and commit the updated netlify.toml."
            echo "See ADR-0030 for background on the hash-based CSP strategy."
            exit 1
          fi
          echo "netlify.toml is in sync with build output."
