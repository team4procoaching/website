name: Semgrep

run-name: >-
  Semgrep • ${{ github.event_name }} • ${{ github.ref_name }}

# ============================================================================
# SCAN STRATEGY & TRIGGERS
# ============================================================================
# 1. Pull Request (PR → main):
#    - Automatic diff-aware scanning (changed files only)
#    - Blocks merge on critical findings
#    - Semgrep automatically detects which files need scanning
#
# 2. Push (main branch):
#    - Updates GitHub Security Tab
#    - Full scan of current state
#
# 3. Scheduled (Weekly):
#    - Monday 04:30 UTC - Full scan for drift detection
#    - Detects new vulnerabilities in existing patterns
#
# 4. Manual Trigger:
#    - On-demand scan via GitHub UI
#
# RESOURCE OPTIMIZATION:
# - Bot commits are skipped (Renovate, Dependabot)
# - Semgrep's built-in diff-aware scanning (no manual file detection needed)
# - Automatic concurrency control (cancel-in-progress)
#
# CONFIGURATION FILES:
# - .semgrep/: Custom project-specific rules (loaded via --config)
# - .semgrepignore: Exclusion patterns (dependencies, build outputs, etc.)
# ============================================================================

on:
  # Scan on Pull Requests against main
  pull_request:
    branches:
      - main

  # Scan on Push to main (after merge)
  push:
    branches:
      - main

  # Weekly scan: Every Monday at 04:30 UTC
  schedule:
    - cron: "30 4 * * 1"

  # Manual trigger via GitHub UI
  workflow_dispatch: {}

# ============================================================================
# PERMISSIONS (Least Privilege Principle)
# ============================================================================
# Minimal permissions for security best practices
permissions:
  contents: read # Required: Read repository code
  security-events: write # Required: Write SARIF results to Security tab

# ============================================================================
# CONCURRENCY (Prevents Parallel Runs)
# ============================================================================
# Cancels older runs when new ones are triggered (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ============================================================================
# JOBS
# ============================================================================
jobs:
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Official Semgrep Docker image. Digest-pinned per Sonar S6596 and
    # the repo digest-pin convention (every external action is
    # 40-char-SHA pinned via renovate.json's helpers:pinGitHubActionDigests).
    # semgrep/semgrep has no semver tags (see
    # github.com/semgrep/semgrep/issues/10472); Renovate's github-actions
    # manager bumps the digest. Trailing date = index timestamp at pin time.
    container:
      image: semgrep/semgrep@sha256:326e5f41cc972bb423b764a14febbb62bbad29ee1c01820805d077dd868fea48 # 2026-04-22

    # ========================================================================
    # BOT FILTER: Skip automatic commits
    # ========================================================================
    # Renovate and Dependabot updates don't need Semgrep scans
    # (covered by PR review and their own security checks)
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'

    steps:
      # ======================================================================
      # CHECKOUT: Retrieve repository code
      # ======================================================================
      # Semgrep needs access to the complete code
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # ======================================================================
      # SEMGREP SCAN (Platform Rules)
      # ======================================================================
      # 'semgrep ci' is the official command for CI/CD integration
      #
      # What 'semgrep ci' does automatically:
      # - Diff-aware scanning on PRs (scans only changed files)
      # - Loads rulesets from Semgrep Registry
      # - Respects .semgrepignore
      # - Generates SARIF output
      # - Exit code 1 on findings (= job fails automatically)
      #
      # IMPORTANT: 'semgrep ci' with SEMGREP_APP_TOKEN does NOT accept
      # --config — platform rules and local rules are mutually exclusive.
      # Custom rules run in a separate step below.
      - name: Run Platform Rules
        run: |
          mkdir -p sarif-results
          semgrep ci --sarif --output=sarif-results/platform.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # ======================================================================
      # SEMGREP SCAN (Custom Project Rules)
      # ======================================================================
      # Runs project-specific rules from .semgrep/ using 'semgrep scan'
      # (not 'semgrep ci', which refuses --config when logged in).
      # These rules catch Astro-specific patterns that platform rulesets
      # don't cover (e.g., JSX comment placement in Astro 6).
      #
      # Scope: src/ (components, data, utils) + scripts/ (convention checks).
      # Config files in root are not scanned — .semgrepignore handles exclusions.
      #
      # !cancelled() ensures this runs after platform findings (exit 1) but
      # stops cleanly on manual workflow cancellation.
      - name: Run Custom Rules
        if: "!cancelled()"
        run:
          semgrep scan --config .semgrep/ --sarif --output=sarif-results/custom.sarif src/ scripts/

      # ======================================================================
      # SARIF FALLBACK
      # ======================================================================
      # Either scan step may not produce a SARIF file (zero findings,
      # early exit, config error). Create minimal valid SARIF for any
      # missing file so the upload step does not fail.
      - name: Ensure SARIF files exist
        if: "!cancelled()"
        run: |
          for f in sarif-results/platform.sarif sarif-results/custom.sarif; do
            if [ ! -f "$f" ]; then
              echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0","runs":[]}' > "$f"
            fi
          done

      # ======================================================================
      # UPLOAD SARIF: Results to GitHub Security tab
      # ======================================================================
      # Uploads all SARIF files from both scan steps.
      # The sarif_file parameter accepts a directory — GitHub merges
      # all .sarif files into a single Code Scanning view.
      #
      # '!cancelled()' ensures results are uploaded even if a scan had
      # findings (exit code 1), but not on manual workflow cancellation.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4
        with:
          sarif_file: sarif-results
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.fork != true)
