name: Tests

run-name: >-
  Tests • ${{ github.event_name }} • ${{ github.ref_name }}

# ============================================================================
# TEST STRATEGY
# ============================================================================
# 1. Pull Request (PR → main):
#    - Runs Vitest unit tests (src/**/*.test.ts, scripts/**/*.test.mjs)
#    - Acts as quality gate to prevent broken utilities and data integrity
#
# 2. Push (main branch):
#    - Same as PR — validates test integrity after merge
#
# DESIGN DECISIONS:
# - No path filtering: tests run on every PR including doc-only changes.
#   This avoids the GitHub Actions "pending check" problem where workflow-
#   level path filters prevent the workflow from starting, causing required
#   status checks to hang indefinitely. Tests complete in <10 seconds with
#   cached dependencies — the simplicity is worth the CI time.
# - No bot skipping: Renovate auto-merges patch/minor updates. Running
#   tests on bot PRs ensures broken dependencies are caught before merge.
#
# REPORTING:
# - Results visible in Job Summary with pass/fail status
# - Inline annotations in PR diffs via --reporter=github-actions
# - Failed tests block merge via branch protection ("Test Status")
# ============================================================================

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# ============================================================================
# CONCURRENCY (Prevent Duplicate Runs)
# ============================================================================
# Uses PR number when available (isolates PR runs), falls back to ref for
# push events. Prevents collisions between parallel PR and push triggers.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ============================================================================
# JOBS
# ============================================================================
jobs:
  # ==========================================================================
  # JOB 1: RUN TESTS
  # ==========================================================================
  # Purpose: Execute Vitest unit tests for utility functions and data
  #          integrity (quiz cross-references, service lookups, etc.)
  # Environment: Matches the Node.js version in .nvmrc and the pnpm version in
  # package.json's packageManager field
  # ==========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Per-job permissions (Least Privilege Principle).
    permissions:
      contents: read # Required: Read repository code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # ======================================================================
      # ENVIRONMENT SETUP
      # ======================================================================
      # Uses pnpm via Corepack (built into Node.js) to match the exact
      # packageManager version specified in package.json.
      # pnpm/action-setup is not needed when using Corepack.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Tool Versions
        run: node --version && pnpm --version

      # ======================================================================
      # TEST EXECUTION
      # ======================================================================
      # 'vitest run' executes all tests once (no watch mode).
      # --reporter=default: standard terminal output in logs
      # --reporter=github-actions: inline annotations in PR diffs
      # Exit code 1 on failure = job fails = PR merge blocked.
      - name: Run Tests
        id: run_tests
        run: pnpm test:run -- --reporter=default --reporter=github-actions

      - name: Create Job Summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** $EVENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_OUTCOME" = "success" ]; then
            echo "✅ All tests passed." >> $GITHUB_STEP_SUMMARY
          elif [ "$TEST_OUTCOME" = "cancelled" ]; then
            echo "⚠️ Tests were cancelled." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed. Review the logs above." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # JOB 2: STATUS CHECK (GitHub Branch Protection)
  # ==========================================================================
  # Purpose: Provide consistent status check for branch protection rules
  #
  # IMPORTANT: In Branch Protection settings, add "Test Status" (this job)
  # as the required check — not "Unit Tests" (the main job). This job runs
  # unconditionally via always(), ensuring PRs always receive a status.
  #
  # Behavior:
  #   - ✅ GREEN: Tests passed
  #   - ❌ RED: Tests failed, were cancelled, or were skipped
  #
  # NOTE: `skipped` is treated as failure. Currently no code path skips the
  # test job. If a future change adds a condition that legitimately skips
  # it (e.g., path filtering), this case must be reconsidered explicitly.
  # ==========================================================================
  test-status:
    name: Test Status
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1

    # Per-job permissions (Least Privilege Principle).
    # contents: read kept uniform across jobs even though this status job
    # only reads needs.test.result; uniform shape is self-documenting.
    permissions:
      contents: read

    steps:
      - name: Evaluate Test Results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Test Result: $RESULT"

          case "$RESULT" in
            success)
              echo "✅ All tests passed"
              exit 0
              ;;
            failure)
              echo "❌ Tests failed — review test output before merging"
              exit 1
              ;;
            cancelled)
              echo "❌ Tests were cancelled"
              exit 1
              ;;
            skipped)
              echo "❌ Tests were skipped unexpectedly"
              exit 1
              ;;
            *)
              echo "⚠️ Unexpected result: $RESULT"
              exit 1
              ;;
          esac
