name: Quality

run-name: >-
  Quality • ${{ github.event_name }} • ${{ github.ref_name }}

# ============================================================================
# QUALITY CHECK STRATEGY
# ============================================================================
# 1. Pull Request (PR → main):
#    - Runs TypeScript, Biome lint, format validation, convention checks
#    - Acts as quality gate to prevent code standard violations
#
# 2. Push (main branch):
#    - Same as PR — validates quality after merge
#
# DESIGN DECISIONS:
# - No path filtering: checks run on every PR including doc-only changes.
#   This avoids the GitHub Actions "pending check" problem where workflow-
#   level path filters prevent the workflow from starting, causing required
#   status checks to hang indefinitely. The checks complete in <30 seconds
#   with cached dependencies — the simplicity is worth the CI time.
# - No bot skipping: Renovate auto-merges patch/minor updates. Running
#   quality checks on bot PRs ensures type errors and lint violations
#   from dependency updates are caught before merge.
# - Steps are split (not a single `pnpm check`) for diagnostic visibility.
#   Locally, `pnpm check` is fail-fast (&&) — the first error stops the
#   chain. In CI, all four checks run sequentially but continue past
#   failures, so all problems are visible in a single run.
#
# REPORTING:
# - Results visible in Job Summary with per-check pass/fail table
# - Failed checks block merge via branch protection ("Quality Status")
# ============================================================================

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# ============================================================================
# CONCURRENCY (Prevent Duplicate Runs)
# ============================================================================
# Uses PR number when available (isolates PR runs), falls back to ref for
# push events. Prevents collisions between parallel PR and push triggers.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ============================================================================
# JOBS
# ============================================================================
jobs:
  # ==========================================================================
  # JOB 1: QUALITY CHECKS
  # ==========================================================================
  # Purpose: Run TypeScript, Biome lint, format, and convention checks
  # Environment: Matches the Node.js version in .nvmrc and the pnpm version in
  # package.json's packageManager field
  #
  # Each step maps to one phase of `pnpm check`, split for diagnostic
  # visibility in the GitHub Actions UI. The `if: always()` chain ensures
  # all checks run even if an earlier one fails — you see all problems at
  # once instead of fixing them one at a time.
  # ==========================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Per-job permissions (Least Privilege Principle).
    permissions:
      contents: read # Required: Read repository code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # ======================================================================
      # ENVIRONMENT SETUP
      # ======================================================================
      # Uses pnpm via Corepack (built into Node.js) to match the exact
      # packageManager version specified in package.json.
      # pnpm/action-setup is not needed when using Corepack.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Tool Versions
        run: node --version && pnpm --version

      # ======================================================================
      # QUALITY CHECKS (split for diagnostic visibility)
      # ======================================================================
      - name: TypeScript Check
        id: typecheck
        run: pnpm typecheck

      - name: Biome Lint
        id: lint
        if: always() && steps.typecheck.outcome != 'cancelled'
        run: pnpm lint

      - name: Format Check
        id: format
        if: always() && steps.lint.outcome != 'cancelled'
        run: pnpm format:check

      - name: Convention Check
        id: conventions
        if: always() && steps.format.outcome != 'cancelled'
        run: pnpm check:conventions

      - name: Biome Rule Baseline
        id: biome_rules
        if: always() && steps.conventions.outcome != 'cancelled'
        run: pnpm check:biome-rules

      # ======================================================================
      # DOC-CONSISTENCY (ADVISORY — NON-BLOCKING)
      # ======================================================================
      # The project's first non-blocking CI step (ADR-0060). It runs the
      # doc-consistency sensor and renders any findings into the Job Summary,
      # but never gates merge. Two independent non-gating guarantees:
      #   1. The sensor always exits 0 on clean AND on findings (only a genuine
      #      internal fault exits non-zero), so it never flips the job result.
      #   2. continue-on-error: true keeps even that internal-fault exit
      #      non-gating — a failed step is recorded with outcome: failure but
      #      does not contribute to the job's result, so the required
      #      "Quality Status" check stays green.
      # It is deliberately NOT in the quality-status job's needs/aggregation.
      - name: Doc-Consistency (advisory)
        id: doc_consistency
        if: always() && steps.biome_rules.outcome != 'cancelled'
        continue-on-error: true
        run: |
          OUTPUT="$(pnpm check:doc-consistency)"
          # Branch on the PINNED sentinel line, never on incidental finding-prose.
          # The sensor emits `Doc-consistency findings: <N>` as its final stdout
          # line on every non-error run; <N> is the finding count (0 == clean).
          # A missing sentinel (internal-fault path) leaves COUNT empty, which
          # the -n guard routes to the "No findings" branch — the fault's
          # visibility is owned by continue-on-error's recorded outcome: failure.
          COUNT="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Doc-consistency findings: \([0-9]\{1,\}\)$/\1/p' | tail -n 1)"
          {
            echo "## 📎 Doc-Consistency (advisory)"
            echo ""
            if [ -n "$COUNT" ] && [ "$COUNT" -gt 0 ]; then
              echo "Advisory findings below — they do **not** block merge:"
              echo ""
              echo '```'
              printf '%s\n' "$OUTPUT"
              echo '```'
            else
              echo "No findings — all enrolled surfaces well-formed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Job Summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          CONVENTIONS: ${{ steps.conventions.outcome }}
          BIOME_RULES: ${{ steps.biome_rules.outcome }}
        run: |
          echo "## 🔍 Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** $EVENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:-------|" >> $GITHUB_STEP_SUMMARY
          for check in "TypeScript:$TYPECHECK" "Biome Lint:$LINT" "Formatting:$FORMAT" "Conventions:$CONVENTIONS" "Biome Rule Baseline:$BIOME_RULES"; do
            name="${check%%:*}"
            result="${check##*:}"
            case "$result" in
              success)   echo "| $name | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              skipped)   echo "| $name | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
              cancelled) echo "| $name | ⚠️ Cancelled |" >> $GITHUB_STEP_SUMMARY ;;
              *)         echo "| $name | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          done

  # ==========================================================================
  # JOB 2: STATUS CHECK (GitHub Branch Protection)
  # ==========================================================================
  # Purpose: Provide consistent status check for branch protection rules
  #
  # IMPORTANT: In Branch Protection settings, add "Quality Status" (this job)
  # as the required check — not "Quality Checks" (the main job). This job
  # runs unconditionally via always(), ensuring PRs always receive a status.
  #
  # Behavior:
  #   - ✅ GREEN: Checks passed
  #   - ❌ RED: Checks failed, were cancelled, or were skipped
  #
  # NOTE: `skipped` is treated as failure. Currently no code path skips the
  # quality job. If a future change adds a condition that legitimately skips
  # it (e.g., path filtering), this case must be reconsidered explicitly.
  # ==========================================================================
  quality-status:
    name: Quality Status
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1

    # Per-job permissions (Least Privilege Principle).
    # contents: read kept uniform across jobs even though this status job
    # only reads needs.quality.result; uniform shape is self-documenting.
    permissions:
      contents: read

    steps:
      - name: Evaluate Quality Results
        env:
          RESULT: ${{ needs.quality.result }}
        run: |
          echo "Quality Result: $RESULT"

          case "$RESULT" in
            success)
              echo "✅ All quality checks passed"
              exit 0
              ;;
            failure)
              echo "❌ Quality checks failed — review output before merging"
              exit 1
              ;;
            cancelled)
              echo "❌ Quality checks were cancelled"
              exit 1
              ;;
            skipped)
              echo "❌ Quality checks were skipped unexpectedly"
              exit 1
              ;;
            *)
              echo "⚠️ Unexpected result: $RESULT"
              exit 1
              ;;
          esac
