# SonarCloud analysis configuration.
#
# ADR-0017 mandates a byte-symmetric `as const satisfies Record<…>` shape for
# every ID-keyed data module under `src/data/`. SonarCloud's Copy-Paste-Detector
# is designed to flag exactly that shape, so the data layer is carved out of CPD
# detection by criterion, not by file enumeration. See
# `docs/adr/0058-data-module-cpd-exclusion.md` for the policy and the rationale.

sonar.cpd.exclusions=src/data/**/*.ts
